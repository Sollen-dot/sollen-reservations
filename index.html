<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#263d34"><title>Sollen Reservations</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#24372e;background:#f6f4ef}*{box-sizing:border-box}body{margin:0}.wrap{max-width:560px;margin:auto;padding:24px 18px 40px}header{text-align:center;padding:22px 0}header small{letter-spacing:3px;color:#788579}h1{font-family:Georgia,serif;font-size:34px;font-weight:400;margin:8px}header p{color:#778178;margin:0}.panel{background:white;border:1px solid #e4e5de;border-radius:20px;padding:20px;box-shadow:0 5px 20px #24372e0a}label{display:block;font-size:13px;font-weight:650;margin:16px 0 7px}select,input{width:100%;padding:13px;border:1px solid #cbd4cc;border-radius:10px;background:#fff;color:#24372e;font:inherit}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;gap:10px;align-items:center;margin-top:16px}.check input{width:19px;height:19px;accent-color:#355b46}.check label{margin:0;font-size:14px}.result{background:#263d34;color:#fff;border-radius:18px;padding:20px;margin-top:18px}.result h2{font:normal 19px Georgia,serif;margin:0 0 15px}.line{display:flex;justify-content:space-between;gap:12px;margin:10px 0;color:#e1e9e2;font-size:14px}.total{border-top:1px solid #61766a;padding-top:15px;margin-top:16px;display:flex;justify-content:space-between;align-items:center}.total strong{font-size:30px}button{background:#c6a777;color:#24372e;border:0;border-radius:12px;padding:15px;width:100%;font-size:15px;font-weight:700;margin-top:16px}#msg{font-size:13px;text-align:center;margin-top:8px}footer{text-align:center;font-size:12px;color:#89948a;margin-top:25px}</style></head><body><div class="wrap"><header><small>SOLLEN EXPERIENCES</small><h1>The Secret Garden</h1><p>Calculator rezervări</p></header><main class="panel"><label for="unit">Bungalow</label><select id="unit"><option>Zefir</option><option>Pin Forest</option><option>Stone Peak</option></select><div class="two"><div><label for="start">Check-in</label><input id="start" type="date"></div><div><label for="end">Check-out</label><input id="end" type="date"></div></div><label for="people">Număr persoane</label><select id="people"><option value="2">2 persoane</option></select><div class="check"><input type="checkbox" id="pool" checked><label for="pool">Piscină încălzită disponibilă (+100 lei/noapte)</label></div><div class="check"><input type="checkbox" id="jac"><label for="jac">Jacuzzi privat (150 lei prima noapte, apoi 75 lei)</label></div><div class="result"><h2>Oferta de cazare</h2><div class="line"><span>Durata</span><span id="nights">—</span></div><div class="line"><span>Cazare și mic dejun</span><span id="stay">—</span></div><div class="line"><span>Jacuzzi privat</span><span id="jacCost">—</span></div><div class="total"><span>Total sejur</span><strong id="total">—</strong></div><button id="copy">Copiază oferta pentru client</button><div id="msg"></div></div><footer>Mic dejun continental și saună incluse • Tarife orientative, modificabile în cod</footer></main></div><script>const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('ro-RO').format(n)+' lei';let offer='';const today=new Date();function dateLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}let tomorrow=new Date(today);tomorrow.setDate(today.getDate()+1);$('start').value=dateLocal(today);$('end').value=dateLocal(tomorrow);function calc(){let max=$('unit').value==='Zefir'?2:4;let p=$('people'),old=+p.value;p.innerHTML='';for(let i=2;i<=max;i++){let o=document.createElement('option');o.value=i;o.textContent=i+' persoane';p.appendChild(o)}p.value=String(Math.min(old||2,max));render()}function render(){let s=$('start').value,e=$('end').value;if(!s||!e)return;let start=new Date(s+'T12:00:00'),end=new Date(e+'T12:00:00'),days=Math.round((end-start)/86400000);if(days<1||days>365){$('total').textContent='Verifică datele';$('nights').textContent='—';$('stay').textContent='—';$('jacCost').textContent='—';offer='';return}let cost=0,weekendN=0;for(let i=0;i<days;i++){let d=new Date(start);d.setDate(start.getDate()+i);let weekend=[5,6].includes(d.getDay());if(weekend)weekendN++;cost+=(weekend?600:500)+($('pool').checked?100:0)+(+ $('people').value-2)*100}let jc=$('jac').checked?150+(days-1)*75:0;$('nights').textContent=days+' '+(days===1?'noapte':'nopți')+' ('+weekendN+' weekend)';$('stay').textContent=fmt(cost);$('jacCost').textContent=fmt(jc);$('total').textContent=fmt(cost+jc);offer='Sollen Experiences – The Secret Garden\nBungalow: '+$('unit').value+'\nCheck-in: '+s+'\nCheck-out: '+e+'\nPersoane: '+$('people').value+'\nPiscină încălzită: '+($('pool').checked?'inclusă':'indisponibilă')+'\nCazare cu mic dejun și saună: '+fmt(cost)+'\nJacuzzi privat: '+($('jac').checked?fmt(jc):'nu')+'\nTOTAL: '+fmt(cost+jc)+'\nTarif orientativ, supus confirmării disponibilității.'}$('unit').addEventListener('change',calc);['start','end','people','pool','jac'].forEach(x=>$(x).addEventListener('change',render));$('copy').addEventListener('click',async()=>{if(!offer)return;try{await navigator.clipboard.writeText(offer);$('msg').textContent='Oferta a fost copiată!'}catch(e){$('msg').textContent='Selectează și copiază oferta din browser.'}});calc();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
